[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phantasm-core"
version = "0.1.0"
description = "PHANTASM — Probabilistic Heterogeneous Attribution & Nexus Trace for Automated SAHYOG Mapping"
authors = [{ name = "PHANTASM Team (SIH26182)" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.19",
    "redis>=5.0.0",
    "neo4j>=5.21.0",
    "httpx>=0.27.0",
    "web3>=6.20.0",
    "base58>=2.1.1",
    "bech32>=1.2.0",
    "python-multipart>=0.0.9",
    "minio>=7.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["SIM102", "S110", "BLE001", "TRY201", "B008", "F401", "RUF013", "F841", "RUF059", "RUF012", "LOG015", "SIM103", "C403"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
